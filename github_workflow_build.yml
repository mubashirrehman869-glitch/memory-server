name: Build Memory Saver

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main, master]

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows project files and permissions
        shell: bash
        run: |
          (cd desktop && flutter create --platforms=windows .)
          dart tools/prepare_platforms.dart
      - name: Build Windows app
        working-directory: desktop
        run: |
          flutter pub get
          flutter build windows --release
      - name: Build Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MemorySaver-Windows-Setup
          path: dist/MemorySaver-Setup.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files and permissions
        run: |
          (cd mobile && flutter create --platforms=android .)
          dart tools/prepare_platforms.dart
      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MemorySaver-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create macOS project files and permissions
        run: |
          (cd desktop && flutter create --platforms=macos .)
          dart tools/prepare_platforms.dart
      - name: Build macOS app and DMG
        run: |
          (cd desktop && flutter pub get && flutter build macos --release)
          mkdir -p dist
          hdiutil create -volname "Memory Saver" -srcfolder desktop/build/macos/Build/Products/Release/memory_saver_desktop.app -ov -format UDZO dist/MemorySaver.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MemorySaver-Mac-DMG
          path: dist/MemorySaver.dmg
